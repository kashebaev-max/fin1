<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Finstat.kz — полный обзор (вертикаль)</title>
<style>
  :root {
    --bg: #0C0F15; --card: #131720; --brd: #1C2233;
    --t1: #E4E9F2; --t2: #9BA4B8; --t3: #5E6A82;
    --accent: #6366F1; --purple: #A855F7; --green: #10B981;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:var(--bg); color:var(--t1);
    font-family:"Segoe UI",Roboto,Arial,sans-serif; overflow:hidden;
  }
  #stage {
    position:relative; width:100vw; height:100vh;
    background: radial-gradient(900px 600px at 50% -5%, rgba(99,102,241,.2), transparent 55%), var(--bg);
    overflow:hidden;
  }
  .scene {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden;
  }
  .v { width:100%; max-width:920px; padding:56px 48px; display:flex; flex-direction:column; gap:20px; }
  .card { background:var(--card); border:1px solid var(--brd); border-radius:20px; }
  .logo { width:88px; height:88px; border-radius:22px; background:linear-gradient(135deg,#6366F1,#A855F7);
    display:flex; align-items:center; justify-content:center; font-size:52px; font-weight:800; color:#fff;
    box-shadow:0 20px 50px rgba(99,102,241,.4); }
  .h1 { font-size:56px; font-weight:800; line-height:1.05; letter-spacing:-.02em; }
  .h2 { font-size:42px; font-weight:800; line-height:1.1; }
  .sub { font-size:24px; color:var(--t2); line-height:1.45; }
  .gbar { height:6px; border-radius:3px; width:100%; }
  .gicon { font-size:56px; }
  .feat-head { display:flex; align-items:center; gap:20px; }
  .feat-ic { width:72px; height:72px; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:36px; flex-shrink:0; }
  .mock { padding:20px 22px; display:flex; flex-direction:column; gap:12px; }
  .mrow { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-radius:12px; background:rgba(255,255,255,.03); border:1px solid var(--brd); font-size:17px; }
  .mrow .k { color:var(--t3); font-size:14px; }
  .mrow .v { font-weight:700; text-align:right; max-width:55%; }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .kpi { padding:18px; }
  .kpi .lbl { font-size:12px; color:var(--t3); font-weight:700; text-transform:uppercase; }
  .kpi .val { font-size:26px; font-weight:800; margin-top:8px; }
  .chart { display:flex; align-items:flex-end; gap:10px; height:140px; padding:18px; }
  .bar { flex:1; border-radius:8px 8px 0 0; background:linear-gradient(180deg,var(--accent),var(--purple)); transform-origin:bottom; }
  .mega { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-height:1200px; overflow:hidden; }
  .mega .m { padding:14px 10px; text-align:center; font-size:13px; color:var(--t2); border-radius:12px; }
  .mega .m .ic { font-size:28px; display:block; margin-bottom:6px; }
  .cta-btn { padding:20px 36px; border-radius:16px; background:#fff; color:var(--accent); font-weight:800; font-size:26px; display:inline-block; text-align:center; }
  .counter { font-size:15px; color:var(--t3); font-weight:600; }
  .doc { width:280px; height:360px; border-radius:14px; background:#fff; color:#111; padding:20px; position:relative; flex-shrink:0; }
  .doc .line { height:8px; background:#e5e7eb; border-radius:4px; margin:10px 0; }
  .scanline { position:absolute; left:0; right:0; height:40px; background:linear-gradient(180deg,rgba(99,102,241,0),rgba(99,102,241,.5)); border-bottom:2px solid var(--accent); }
  .bubble { padding:16px 18px; border-radius:16px; font-size:18px; line-height:1.5; max-width:90%; }
  .bubble.q { align-self:flex-end; background:var(--accent); color:#fff; }
  .bubble.a { align-self:flex-start; background:var(--card); border:1px solid var(--brd); }
  .flex-col { display:flex; flex-direction:column; gap:14px; }
  .flex-row { display:flex; gap:24px; align-items:center; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="promo-full-vertical-engine.js"></script>
</body>
</html>
