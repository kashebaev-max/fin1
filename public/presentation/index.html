<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Презентация системы — Finstat.kz</title>
  <style>
    :root {
      --bg: #0c0f15;
      --card: #131720;
      --brd: #1c2233;
      --t1: #e4e9f2;
      --t2: #9ba4b8;
      --t3: #5e6a82;
      --accent: #6366f1;
      --purple: #a855f7;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--t1); font-family: "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
    #deck { height: 100%; position: relative; }
    .slide {
      position: absolute; inset: 0;
      display: none; flex-direction: column;
      padding: 48px 56px 72px;
      background: radial-gradient(900px 500px at 80% -10%, rgba(99,102,241,.15), transparent 60%), var(--bg);
    }
    .slide.active { display: flex; }
    .slide.title-slide { align-items: center; justify-content: center; text-align: center; }
    .logo { width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(135deg, var(--accent), var(--purple)); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 800; color: #fff; margin-bottom: 24px; }
    h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; }
    h1 .grad { background: linear-gradient(135deg, var(--accent), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    h2 { font-size: clamp(1.5rem, 3.5vw, 2.2rem); font-weight: 800; margin-bottom: 12px; letter-spacing: -0.02em; }
    .sub { font-size: clamp(1rem, 2vw, 1.25rem); color: var(--t2); line-height: 1.5; max-width: 720px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--accent); background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.35); padding: 6px 12px; border-radius: 999px; margin-bottom: 16px; }
    .content { flex: 1; display: grid; grid-template-columns: 1fr 1.1fr; gap: 32px; align-items: center; min-height: 0; margin-top: 20px; }
    .content img, .shot { width: 100%; max-height: min(58vh, 520px); object-fit: contain; border-radius: 14px; border: 1px solid var(--brd); background: var(--card); box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    ul.bullets { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    ul.bullets li { font-size: 1.05rem; color: var(--t2); padding-left: 22px; position: relative; line-height: 1.45; }
    ul.bullets li::before { content: "✓"; position: absolute; left: 0; color: var(--green); font-weight: 700; }
    .mods { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .mod { font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.04); border: 1px solid var(--brd); color: var(--t2); }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; width: 100%; max-width: 900px; margin-top: 32px; }
    .stat { background: var(--card); border: 1px solid var(--brd); border-radius: 14px; padding: 20px; text-align: center; }
    .stat .v { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat .l { font-size: 13px; font-weight: 700; margin-top: 4px; }
    .stat .s { font-size: 11px; color: var(--t3); margin-top: 4px; }
    .grid-areas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 800px; margin-top: 24px; }
    .area { padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--brd); font-size: 14px; font-weight: 600; text-align: center; }
    .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
    .preset { padding: 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--brd); }
    .preset b { display: block; margin-bottom: 6px; }
    .preset span { font-size: 13px; color: var(--t3); line-height: 1.45; }
    .cta-box { margin-top: 28px; padding: 28px 36px; border-radius: 16px; background: linear-gradient(135deg, var(--accent), var(--purple)); text-align: center; max-width: 520px; color: #fff; font-size: 1.2rem; font-weight: 700; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: rgba(12,15,21,.92); border-top: 1px solid var(--brd); backdrop-filter: blur(8px); z-index: 20; }
    .nav button { background: var(--card); border: 1px solid var(--brd); color: var(--t1); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .nav button:hover { border-color: var(--accent); }
    .progress { flex: 1; margin: 0 20px; height: 4px; background: var(--brd); border-radius: 2px; overflow: hidden; }
    .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); transition: width 0.25s; }
    .counter { font-size: 12px; color: var(--t3); min-width: 64px; text-align: center; }
    .hint { position: fixed; top: 16px; right: 20px; font-size: 11px; color: var(--t3); z-index: 20; }
    @media (max-width: 900px) {
      .slide { padding: 32px 20px 64px; }
      .content { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
    }
    @media print {
      @page { size: 1920px 1080px; margin: 0; }
      html, body { height: auto; overflow: visible; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #deck { height: auto; position: static; }
      .slide {
        position: relative; inset: auto;
        display: flex !important;
        width: 1920px; height: 1080px;
        page-break-after: always; break-after: page;
        overflow: hidden;
      }
      .slide:last-child { page-break-after: auto; }
      .content img, .shot { max-height: 520px; }
      h1 .grad, .stat .v { -webkit-text-fill-color: #818cf8; color: #818cf8; }
      .nav, .hint { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="hint"><a href="/" style="color:var(--accent);text-decoration:none;font-weight:600">← finstat.kz</a> · ← → · <a href="finstat-presentation.pdf" style="color:var(--accent);text-decoration:none">PDF</a></div>
  <div id="deck"></div>
  <nav class="nav">
    <button type="button" id="prev">← Назад</button>
    <div class="progress"><i id="bar"></i></div>
    <span class="counter" id="counter">1 / 1</span>
    <button type="button" id="next">Далее →</button>
  </nav>
  <script>
    var SLIDES = [
      {
        type: "title",
        html: '<div class="logo">₸</div><div class="badge">ЕДИНАЯ СИСТЕМА ВЕДЕНИЯ БИЗНЕСА</div><h1>Finstat<span class="grad">.kz</span></h1><p class="sub" style="margin-top:20px">Умный помощник для вашего бизнеса<br>CRM · Склад · Финансы · Кадры · Налоги · AI</p><p class="sub" style="margin-top:12px;font-size:14px;color:var(--t3)">НК РК 2026 · 60+ модулей · 30 дней бесплатно</p>'
      },
      {
        type: "split",
        badge: "ПОЗИЦИОНИРОВАНИЕ",
        title: "Всё для бизнеса — в одном окне",
        text: "<ul class='bullets'><li>Не только бухгалтерия — продажи, торговля, склад, деньги, кадры</li><li>60+ модулей связаны: один документ обновляет всю систему</li><li>Облако в браузере — без установки, импорт экспорта из других программ</li><li>Казахстан: НК РК 2026, ФНО, Kaspi-оплата</li></ul>",
        img: "assets/hero-dashboard.svg",
        alt: "Главная панель KPI"
      },
      { type: "stats", title: "Finstat.kz в цифрах", sub: "Полный цикл ведения бизнеса для ТОО и ИП" },
      {
        type: "split",
        badge: "ИНТЕРФЕЙС",
        title: "Понятная навигация",
        text: "<ul class='bullets'><li>Боковое меню по разделам бизнеса</li><li>Глобальный поиск по модулям и документам</li><li>AI Жанара всегда под рукой</li><li>Тёмная и светлая тема</li></ul>",
        img: "assets/sidebar.svg",
        alt: "Меню системы"
      },
      { type: "module", badge: "ПРОДАЖИ И CRM", title: "Продажи и CRM", desc: "Воронка, лиды, контрагенты, договоры, заказы, возвраты, скидки, ABC-анализ.", img: "assets/crm.svg", mods: ["CRM", "Контрагенты", "Договоры", "Заказы", "Возвраты", "Скидки", "Анализ продаж"] },
      { type: "module", badge: "ТОРГОВЛЯ", title: "Торговля и POS", desc: "Розничная касса, чеки, Kaspi QR, смены и Z-отчёты.", img: "assets/pos.svg", mods: ["Касса POS", "Розница"] },
      { type: "module", badge: "СКЛАД", title: "Склад и номенклатура", desc: "Товары, остатки, перемещения, инвентаризация, партии, комплектация, производство.", img: "assets/stock.svg", mods: ["Номенклатура", "Склад", "Перемещения", "Инвентаризация", "Партионный учёт", "Комплектация", "Производство"] },
      { type: "module", badge: "ФИНАНСЫ", title: "Деньги и банк", desc: "Касса, банк, импорт выписки, валюты, регулярные платежи, командировки.", img: "assets/bank.svg", mods: ["Касса", "Банк", "Импорт выписки", "Валюты", "Регулярные платежи", "Командировки"] },
      { type: "module", badge: "БУХГАЛТЕРИЯ", title: "Бухгалтерия", desc: "Проводки, ОСВ, карточка счёта, шахматка, баланс, ОПУ, основные средства.", img: "assets/osv.svg", mods: ["Журнал проводок", "ОСВ", "Карточка счёта", "Шахматка", "Баланс и ОПУ", "Основные средства"] },
      { type: "module", badge: "КАДРЫ", title: "Кадры и зарплата", desc: "Сотрудники, табель Т-13, отпуска, приказы, удержания, больничные по НК 2026.", img: "assets/payroll.svg", mods: ["Сотрудники и ЗП", "Табель Т-13", "Отпуска", "Кадровые приказы", "Удержания", "Больничные"] },
      { type: "module", badge: "НАЛОГИ", title: "Налоги и отчётность", desc: "ФНО 200/300/910/100, справочник НК, ЭСФ, проверка БИН в реестре.", img: "assets/fno.svg", mods: ["Отчёты ФНО", "НК РК 2026", "ЭДО / ЭСФ", "Проверка БИН"] },
      { type: "module", badge: "ДОКУМЕНТЫ", title: "Документы", desc: "12 типов документов, согласование, экспорт, AI-генератор, подача СОНО.", img: "assets/order-new.svg", mods: ["Документы", "Документооборот", "Экспорт", "Генератор", "СОНО"] },
      { type: "module", badge: "АНАЛИТИКА", title: "Аналитика и планирование", desc: "KPI, графики, прогноз кэшфлоу, бюджет, управленческие отчёты, календарь.", img: "assets/analytics.svg", mods: ["Графики", "Прогноз", "Бюджет", "Упр. отчёты", "Календарь"] },
      { type: "module", badge: "AI", title: "Автоматизация и AI", desc: "Жанара, уведомления, журнал AI, сканер OCR, регламент, импорт данных.", img: "assets/zhanara-chat.svg", mods: ["AI Жанара", "Уведомления", "Журнал ИИ", "Сканирование", "Регламент", "Импорт данных", "Сканер OCR"] },
      { type: "module", badge: "ОТРАСЛЕВОЕ", title: "Отраслевые решения", desc: "Преднастройки для медицины, общепита, услуг; транспорт и путевые листы.", img: null, mods: ["Отрасли", "Транспорт", "Путевые листы", "ГСМ"] },
      { type: "module", badge: "СЕРВИС", title: "Сервис и поддержка", desc: "Справка, несколько организаций, настройки модулей, виджет поддержки.", img: "assets/modules.svg", mods: ["Справка", "Организации", "Настройки", "Поддержка"] },
      {
        type: "split",
        badge: "OCR · AI VISION",
        title: "Сфотографировал — готово за 10 секунд",
        text: "<ul class='bullets'><li>Чек, счёт-фактура, накладная, акт — JPG, PNG, PDF</li><li>AI извлекает БИН, суммы, НДС 16%, позиции</li><li>Контрагент, товары, проводки и склад — автоматически</li></ul>",
        img: "assets/ocr-scanner.svg",
        alt: "Сканер документов"
      },
      {
        type: "split",
        badge: "ИМПОРТ",
        title: "Импорт экспорта из других программ",
        text: "<ul class='bullets'><li>Загрузка справочников и документов из выгрузок</li><li>Сопоставление полей и проверка дублей</li><li>Быстрый старт без потери истории</li></ul>",
        img: "assets/migration.svg",
        alt: "Импорт данных"
      },
      { type: "presets", title: "Подходит разному бизнесу", sub: "Включайте только нужные модули" },
      { type: "cta", title: "Finstat.kz — единая система ведения бизнеса", sub: "30 дней бесплатно · 10 000 ₸/мес" }
    ];

    function renderSlide(s, i) {
      var el = document.createElement("section");
      el.className = "slide" + (s.type === "title" || s.type === "cta" ? " title-slide" : "");
      if (s.type === "title") { el.innerHTML = s.html; return el; }
      if (s.type === "cta") {
        el.innerHTML = '<div class="logo">₸</div><h2>' + s.title + '</h2><p class="sub" style="margin-top:16px">' + s.sub + '</p><div class="cta-box">finstat.kz</div>';
        return el;
      }
      if (s.type === "stats") {
        el.innerHTML = '<h2>' + s.title + '</h2><p class="sub">' + s.sub + '</p><div class="stats">' +
          '<div class="stat"><div class="v">60+</div><div class="l">модулей</div><div class="s">От CRM до ФНО</div></div>' +
          '<div class="stat"><div class="v">12</div><div class="l">разделов</div><div class="s">Все процессы</div></div>' +
          '<div class="stat"><div class="v">12</div><div class="l">типов документов</div><div class="s">Счета, акты, ЭСФ</div></div>' +
          '<div class="stat"><div class="v">30</div><div class="l">дней бесплатно</div><div class="s">Полный доступ</div></div></div>' +
          '<div class="grid-areas" style="margin:32px auto 0">' +
          ["CRM", "Склад", "POS", "Банк", "Кадры", "Налоги", "Аналитика", "AI", "Документы"].map(function (a) {
            return '<div class="area">' + a + '</div>';
          }).join("") + '</div>';
        return el;
      }
      if (s.type === "presets") {
        var presets = [
          { n: "Малый бизнес", d: "Базовый учёт без производства и сложной аналитики" },
          { n: "Торговая компания", d: "Опт и розница, склад, без производства" },
          { n: "Производство", d: "Цеха, партии, комплектация, полный цикл" },
          { n: "Услуги", d: "Без склада и POS — проекты, ЗП, налоги" }
        ];
        el.innerHTML = '<h2>' + s.title + '</h2><p class="sub">' + s.sub + '</p><div class="presets">' +
          presets.map(function (p) { return '<div class="preset"><b>' + p.n + '</b><span>' + p.d + '</span></div>'; }).join("") + '</div>';
        return el;
      }
      if (s.type === "module") {
        var mods = (s.mods || []).map(function (m) { return '<span class="mod">' + m + '</span>'; }).join("");
        var imgBlock = s.img
          ? '<img class="shot" src="' + s.img + '" alt="' + (s.title || "") + '" />'
          : '<div class="shot" style="display:flex;align-items:center;justify-content:center;min-height:280px;font-size:64px">🏥</div>';
        el.innerHTML = '<span class="badge">' + s.badge + '</span><h2>' + s.title + '</h2><p class="sub">' + s.desc + '</p>' +
          '<div class="content"><div><div class="mods">' + mods + '</div></div>' + imgBlock + '</div>';
        return el;
      }
      el.innerHTML = '<span class="badge">' + s.badge + '</span><h2>' + s.title + '</h2>' +
        '<div class="content"><div>' + s.text + '</div><img class="shot" src="' + s.img + '" alt="' + (s.alt || "") + '" /></div>';
      return el;
    }

    var deck = document.getElementById("deck");
    var cur = 0;
    SLIDES.forEach(function (s, i) { deck.appendChild(renderSlide(s, i)); });

    function show(n) {
      cur = Math.max(0, Math.min(SLIDES.length - 1, n));
      deck.querySelectorAll(".slide").forEach(function (el, i) { el.classList.toggle("active", i === cur); });
      document.getElementById("counter").textContent = (cur + 1) + " / " + SLIDES.length;
      document.getElementById("bar").style.width = ((cur + 1) / SLIDES.length * 100) + "%";
    }

    document.getElementById("prev").onclick = function () { show(cur - 1); };
    document.getElementById("next").onclick = function () { show(cur + 1); };
    document.onkeydown = function (e) {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); show(cur + 1); }
      if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(cur - 1); }
      if (e.key === "Home") show(0);
      if (e.key === "End") show(SLIDES.length - 1);
    };
    deck.onclick = function (e) {
      if (e.target.closest("button")) return;
      var x = e.clientX / window.innerWidth;
      show(x > 0.65 ? cur + 1 : x < 0.35 ? cur - 1 : cur);
    };
    show(0);
  </script>
</body>
</html>
